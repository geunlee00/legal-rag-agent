server {
    listen 80;
    server_name _;

    # React 빌드 파일 위치
    root /usr/share/nginx/html;
    index index.html;

    # ① Django 정적파일(admin CSS 등) — web 컨테이너가 collectstatic으로 모은 것
    location /static/ {
        alias /static/;
    }

    # ② API 요청 → Django(gunicorn)로 전달  ('web' = compose의 Django 서비스 이름)
    location /api/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ③ Django 관리자 화면도 Django로 전달
    location /admin/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ④ 그 외 모든 경로 → React로 넘김
    #    (SPA 라우팅: /diagnose 같은 주소를 새로고침해도 index.html을 주도록)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
